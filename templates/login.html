{% extends "base.html" %}

{% block title %}Sign In & Register - Apex Bank{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Welcome to Apex Bank</h2>
            <p>Securely manage your deposits, withdrawals, and instant transfers</p>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('loginTab', this)">Sign In</button>
            <button class="tab-btn" onclick="switchTab('registerTab', this)">Create Account</button>
        </div>

        <!-- Login Form -->
        <div id="loginTab" class="tab-content active">
            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label for="login-username"><i class="fa-solid fa-user"></i> Username</label>
                    <input type="text" id="login-username" name="username" class="form-control" placeholder="Enter your username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="login-password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="login-password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-right-to-bracket"></i> Sign In to Account</button>
            </form>
        </div>

        <!-- Register Form -->
        <div id="registerTab" class="tab-content">
            <form action="{{ url_for('handle_register') }}" method="POST">
                <div class="form-group">
                    <label for="reg-username"><i class="fa-solid fa-user-plus"></i> Choose Username</label>
                    <input type="text" id="reg-username" name="username" class="form-control" placeholder="3-20 characters (letters, numbers, _)" required>
                </div>
                <div class="form-group">
                    <label for="reg-password"><i class="fa-solid fa-key"></i> Choose Password</label>
                    <input type="password" id="reg-password" name="password" class="form-control" placeholder="At least 4 characters" required>
                </div>
                <div class="form-group">
                    <label for="reg-name"><i class="fa-solid fa-id-card"></i> Full Name</label>
                    <input type="text" id="reg-name" name="name" class="form-control" placeholder="e.g. Mohit Prajapat" required>
                </div>
                <div class="form-row">
                    <div class="form-group col">
                        <label for="reg-age"><i class="fa-solid fa-cake-candles"></i> Age</label>
                        <input type="number" id="reg-age" name="age" class="form-control" placeholder="e.g. 24" min="10" max="120" required>
                    </div>
                    <div class="form-group col">
                        <label for="reg-city"><i class="fa-solid fa-city"></i> City</label>
                        <input type="text" id="reg-city" name="city" class="form-control" placeholder="e.g. New York" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success btn-block"><i class="fa-solid fa-user-check"></i> Register Account</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function switchTab(tabId, btnElement) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btnElement.classList.add('active');
}
</script>
{% endblock %}
